name: voix
on:
  push:
    paths: ["voix/lignes.json", "voix/gen.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python voix/gen.py
      - run: |
          git config user.name "voix-bot"
          git config user.email "voix-bot@users.noreply.github.com"
          git add voix/out
          git commit -m "voix generees" || echo rien
          git push
